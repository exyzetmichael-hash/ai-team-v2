name: office-gate
version: 3.0.0
description: "Маршрутизация общего офис-чата: на сообщение отвечает ровно один агент. Личку не трогает. Обращение по имени (с русскими склонениями), реплай на своё сообщение и слэш-команда с @упоминанием бота решаются детерминированно, без вызова модели. Сообщение без адресата уходит арбитру: семь процессов атомарно борются за право решить через общую SQLite-таблицу, победитель делает ОДИН вызов модели со всем составом команды и выбирает исполнителя, остальные подчиняются решению. При любом сбое отвечает дежурный профиль (OFFICE_DEFAULT_RESPONDER, по умолчанию secretary) — один, а не все семеро. Дополнительно регистрирует инструмент office_report: им исполнитель карточки Kanban сам пишет в общий чат своим ботом. Реализация требования 6.2 брифа."
author: ai-team-v2
kind: standalone
platforms:
  - linux
  - macos
hooks:
  - pre_gateway_dispatch
