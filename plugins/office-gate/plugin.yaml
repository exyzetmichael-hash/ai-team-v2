name: office-gate
version: 1.0.0
description: "ЧЕРНОВИК под калибровку. Дешёвый гейт 'моя тема / не моя' для группового офис-чата — pre_gateway_dispatch классифицирует входящее сообщение одним дешёвым LLM-вызовом и пропускает полноценный запуск агента только если тема действительно относится к роли профиля (или явно упомянут/это ответ на его сообщение). DM не трогает. Реализация требования 6.2 брифа: дешёвые классификации вместо полных прогонов у каждого агента разом."
author: ai-team-v2
kind: standalone
platforms:
  - linux
  - macos
hooks:
  - pre_gateway_dispatch
