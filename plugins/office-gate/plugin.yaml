name: office-gate
version: 2.0.0
description: "Гейт 'моя тема / не моя' для общего офис-чата: pre_gateway_dispatch решает, должен ли ЭТОТ агент отвечать на сообщение в группе. Личку не трогает. Обращение по имени (с русскими склонениями) и ответ на своё сообщение пропускаются без вызова модели; упоминание другого агента — молчание тоже без вызова модели; в остальных случаях один дешёвый LLM-запрос против описания роли из profile.yaml. При любой ошибке пропускает, а не молчит. Реализация требования 6.2 брифа."
author: ai-team-v2
kind: standalone
platforms:
  - linux
  - macos
hooks:
  - pre_gateway_dispatch
