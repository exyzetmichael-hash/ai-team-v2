# Конфиг профиля "finance" (личный финансист) для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/finance/config.yaml
#
# Провайдер — как у всех: OpenRouter, ключ в .env как OPENROUTER_API_KEY.
# Настраивай мастером `hermes -p finance model`, не редактируй provider/api_key руками.

# Таймзона — где Михаил живёт СЕЙЧАС: Красноярск, UTC+7 (DST в России нет).
# Не Москва: зону надо спрашивать у человека, а не выводить из его планов —
# на этом уже обожглись, сводка приходила на 5 часов позже (см. подробный
# разбор в profiles/secretary/config.yaml).
# При переезде в Петербург (конец августа 2026) — сменить на Europe/Moscow
# здесь и во всех профилях, и пересоздать cron-задачи.
timezone: Asia/Krasnoyarsk

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash
  # Если начнёт врать в арифметике на длинных списках трат — это первый кандидат
  # на апгрейд (openai/gpt-5.4-mini предсказуемее в счёте).

agent:
  # Лёгкий агент по образцу секретаря: память + переписка, ничего тяжёлого.
  # Файловая система/терминал — сознательно НЕТ (принцип брифа 3.3: ФС только у
  # brain). Считает "в уме", поэтому SOUL.md требует показывать выкладки —
  # см. раздел "Арифметика" там. Если на практике окажется, что ошибается в
  # счёте — включить code_execution (убрать строку ниже) дешевле, чем менять модель.
  disabled_toolsets:
    - terminal
    - code_execution
    - browser          # тяжёлая браузерная автоматизация; web_search при этом ОСТАЁТСЯ доступен
    - computer_use
    - delegation
    - image_gen
    - video
    - video_gen
    - vision
    - x_search
    # kanban НЕ выключен (фаза 5, офис): даёт инструменты kanban_create/
    # kanban_show/kanban_complete и т.д. — как раз ими агенты передают работу
    # друг другу через общую доску ~/.hermes/kanban.db. Не путать с delegation
    # выше: то — безымянные сабагенты внутри своего же контекста, а это —
    # адресная передача задачи другому профилю команды.

# --- Kanban: этот gateway диспетчером НЕ работает (фаза 5) ---
# В офисе у каждого агента свой gateway (нужен для его Telegram-бота), но
# диспетчер Kanban должен быть РОВНО ОДИН на всю машину — им назначен
# секретарский gateway (см. profiles/secretary/config.yaml).
# Требование самой документации Hermes (docs/kanban/multi-gateway.md):
# несколько gateway с dispatch_in_gateway=true плодят параллельные SQLite-
# соединения к общей kanban.db и создают WAL-конкуренцию. Поэтому тут — false.
# Работу с доской через инструменты kanban_* это НЕ отключает: агент
# по-прежнему создаёт и закрывает карточки, просто не раздаёт их сам.
kanban:
# Сырые авто-уведомления доски в чат выключены: раньше на каждую закрытую
# карточку прилетало системное «✔ [default] @finance Kanban t_xxx done — …»
# ботом-диспетчером, а следом секретарь пересказывал то же своими словами.
# Теперь отчитывается сам исполнитель через office_report — своим голосом и
# своим ботом. Цена решения: если исполнитель забудет позвать office_report,
# результат останется только на доске (`hermes -p secretary kanban show <id>`).
  auto_subscribe_on_create: false
  dispatch_in_gateway: false

# --- Opt-in в оркестраторский режим Kanban (фаза 5) ---
# НЕОЧЕВИДНО, но обязательно: убрать `kanban` из disabled_toolsets НЕ достаточно.
# Инструменты kanban_* появляются в сессии только если профиль явно перечислил
# `kanban` вот в этом верхнеуровневом ключе `toolsets` — так устроена проверка
# _profile_has_kanban_toolset() в tools/kanban_tools.py, и то же сказано в
# документации Hermes: "available to orchestrator profiles that enable kanban
# in their toolsets config". Без этой строки агент видит kanban в списке
# тулсетов при старте, но вызвать kanban_create не может (поймано на живом
# прогоне: секретарь не нашёл инструмент и полез обходить через терминал).
# `hermes-cli` — дефолтный набор, его сохраняем.
toolsets:
  - hermes-cli
  - kanban

# --- Явный набор инструментов по площадкам (фаза 5) ---
# ДВА КЛЮЧА, НЕ ОДИН. Hermes резолвит инструменты по имени площадки:
# platform_toolsets.get(platform) в hermes_cli/tools_config.py. `cli` — это
# терминальные сессии И воркеры Kanban (диспетчер запускает исполнителя как
# `hermes -p <профиль>`, пиня набор через --toolsets). `telegram` — сессии из
# группового чата и лички бота.
#
# ПОЧЕМУ ОБА ЯВНО: пока был только `cli`, сессия в Telegram откатывалась на
# дефолтный композит `hermes-telegram` — и юрист в общем чате честно сказал
# «у меня нет веб-инструмента», хотя в CLI веб у него был. Списки держим
# одинаковыми, чтобы агент был одним и тем же человеком в чате и в работе.
#
# `office` — тулсет плагина office-gate, даёт инструмент office_report:
# им исполнитель сам пишет в общий чат, от кого получил задачу и что сделал.
# Нужен и в `cli` тоже — карточки Kanban выполняет именно CLI-воркер.
# `agent.disabled_toolsets` выше продолжает работать как вычитание.
platform_toolsets:
  cli:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - tts
    - office
  telegram:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - tts
    - office
