# Конфиг профиля "secretary" для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/secretary/config.yaml
#
# ПРОВАЙДЕР: OpenRouter (перешли на него после того, как ру-реселлеры оказались
# нерабочими — см. docs/phase-1-runbook.md, раздел "Провайдер"). OpenRouter —
# первоклассный провайдер Hermes: ключ уходит в .env как OPENROUTER_API_KEY,
# а сюда пишется только выбор модели. Проще всего настроить мастером
# `hermes -p secretary model` → OpenRouter → вставить ключ → выбрать модель.
# Мастер сам корректно пропишет всё в нужные места (не редактируй руками —
# на ручных правках YAML мы уже обжигались).
#
# ВАЖНО про геоблок: OpenRouter блокирует российские IP (403). Сервер должен
# быть НЕ в РФ (у нас — Contabo EU). См. runbook.

# ⚠️ ТАЙМЗОНА — ГДЕ МИХАИЛ ЖИВЁТ СЕЙЧАС, А НЕ КУДА СОБИРАЕТСЯ.
# Михаил в Красноярске (UTC+7). Перехода на летнее время в России нет.
#
# Без этого ключа Hermes берёт системную зону сервера (EU, CEST) — не его.
# Но одной явной таймзоны мало, если она НЕВЕРНАЯ: сначала тут стояло
# Europe/Moscow — я вывел зону из того, что Михаил поступает в вуз в
# Петербурге и переезжает туда в конце августа. В итоге сводка «в 8 утра»
# приходила в 13:00 по его времени: 08:00 MSK = 12:00 в Красноярске, плюс
# час остаточного сдвига от старого расписания. Вывод на будущее: зону
# нужно СПРАШИВАТЬ у человека, а не выводить из его планов.
#
# ПЕРЕЕЗД В КОНЦЕ АВГУСТА 2026: когда Михаил переедет в Петербург, поменять
# здесь и во всех остальных профилях на Europe/Moscow и ПЕРЕСОЗДАТЬ
# cron-задачи — у задачи хранится абсолютное время следующего запуска, смена
# ключа сама по себе его не пересчитывает.
timezone: Asia/Krasnoyarsk

# Без этого Hermes оборачивает каждую cron-доставку в Telegram служебным
# "Cronjob Response: <имя> (job_id: ...) ------- ... To stop or manage this job...".
# Полезно для отладки, но для ежедневной сводки — просто шум поверх текста,
# который и так уже отформатирован по MORNING.md. Выключаем ради чистого сообщения.
cron:
  wrap_response: false

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash   # дёшево ($0.10/$0.20 за 1M) + рабочий tool-calling; для лёгкого секретаря идеально
  # ключ — в .env: OPENROUTER_API_KEY=sk-or-...
  # запасная модель, если deepseek начнёт чудить: openai/gpt-5.4-mini (дороже, но предсказуемее в tool-calling)

agent:
  # Секретарь — лёгкий. Выключаем всё тяжёлое и опасное; оставляем только
  # то, что реально нужно для времени/напоминаний/сводок.
  # На практике урезали через `hermes -p secretary tools` до: memory, todo, cronjob.
  # disabled_toolsets ниже — дублирующая страховка на случай сброса per-platform.
  #
  # ВАЖНО про terminal (НЕ в списке ниже, сознательно): изначально терминал был
  # выключен ("секретарю шелл не нужен"), но выяснилось, что bundled-скилл
  # Google Workspace (Calendar) в этой версии Hermes не имеет отдельного тула —
  # ВСЕ операции календаря (список/создание/удаление событий, сам OAuth-setup)
  # идут через shell-вызов `python google_api.py ...` (см. docs/phase-2-runbook.md).
  # Без terminal календарь физически не работает. Terminal — это полноценный
  # шелл (Hermes не умеет ограничивать его конкретными командами), так что
  # секретарь технически может прочитать/записать что угодно на сервере, а не
  # только дёрнуть календарь — это сознательно принятый компромиссный риск
  # (обсуждали с Михаилом), смягчённый через approvals.mode: manual ниже.
  disabled_toolsets:
    - code_execution  # выполнение кода секретарю не нужно
    - browser         # тяжёлая браузерная автоматизация
    - computer_use
    - delegation      # fork/join сабагенты внутри своего же контекста — секретарю не нужно, не путать с Kanban (офисная передача задач другому профилю — отдельная фича, включаем её в фазе 5)
    - image_gen
    - video
    - video_gen
    - vision
    - x_search
    # kanban НЕ выключен (фаза 5, офис): даёт инструменты kanban_create/
    # kanban_show/kanban_complete и т.д. — как раз ими агенты передают работу
    # друг другу через общую доску ~/.hermes/kanban.db. Не путать с delegation
    # выше: то — безымянные сабагенты внутри своего же контекста, а это —
    # адресная передача задачи другому профилю команды.

# Ручное подтверждение по-настоящему опасных команд (rm -rf, форк-бомбы и т.п.
# из встроенного списка паттернов Hermes) — раз секретарь теперь с terminal.
# НЕ подтверждает каждую обычную команду (обычные вызовы google_api.py пройдут
# без вопросов) — это защита от катастрофы, не аудит-лог рутины.
approvals:
  mode: manual

# --- Kanban-диспетчер офиса (фаза 5) ---
# ВАЖНО, ГДЕ ЭТО ЛЕЖИТ: диспетчер крутится внутри gateway, а постоянно
# запущенный gateway у нас один — секретарский (системный systemd-сервис).
# Значит настройки диспетчера читаются из ЭТОГО конфига, и одного gateway
# хватает на всю команду: диспетчер порождает исполнителей подпроцессами
# `hermes -p <профиль>`, отдельный gateway каждому агенту не нужен.
# Сама доска общая для всех профилей by design (~/.hermes/kanban.db).
kanban:
# Сырые авто-уведомления доски в чат выключены: раньше на каждую закрытую
# карточку прилетало системное «✔ [default] @finance Kanban t_xxx done — …»
# ботом-диспетчером, а следом секретарь пересказывал то же своими словами.
# Теперь отчитывается сам исполнитель через office_report — своим голосом и
# своим ботом. Цена решения: если исполнитель забудет позвать office_report,
# результат останется только на доске (`hermes -p secretary kanban show <id>`).
  auto_subscribe_on_create: false
  # Ограничители расхода. По умолчанию в Hermes они НЕ заданы, то есть
  # количество одновременных исполнителей ничем не ограничено — а каждый
  # исполнитель это отдельная сессия агента, то есть деньги. Для личной
  # команды на дешёвых моделях разумно держать поток узким: задачи никуда
  # не денутся, просто подождут следующего тика.
  max_in_progress: 2               # одновременно работающих агентов во всей команде
  max_in_progress_per_profile: 1   # и не больше одного экземпляра каждой роли

  # Как часто диспетчер смотрит на доску. 60 сек — дефолт, оставляем:
  # реагирует достаточно быстро, а нагрузки на SQLite почти не создаёт.
  dispatch_interval_seconds: 60

  # После двух подряд неудачных попыток задача уходит в blocked и перестаёт
  # жрать деньги на бесконечные ретраи. Дефолт, оставлен явно как напоминание.
  failure_limit: 2

# --- MCP: Todoist (фаза 8) ---
# Официальный сервер от самого Doist (@doist/todoist-mcp, npm), stdio-режим.
# Задачи Михаила живут в Todoist — секретарь работает с ними напрямую, а не
# держит свой параллельный список.
#
# ⚠️ ТОКЕН СЮДА НЕ ВПИСЫВАТЬ. Hermes подставляет ${TODOIST_API_KEY} из
# окружения (.env профиля) в момент подключения к серверу — сам файл лежит в
# git, секретам тут не место. Важная деталь: в подпроцесс MCP передаётся
# ТОЛЬКО то, что явно перечислено в env: ниже, автоматически .env не наследуется.
mcp_servers:
  todoist:
    command: npx
    args: ["-y", "@doist/todoist-mcp"]
    env:
      TODOIST_API_KEY: "${TODOIST_API_KEY}"
    tools:
      # Сервер отдаёт ~45 инструментов (метки, фильтры, комментарии, воркспейсы,
      # аналитика). Секретарю нужна десятая часть, а каждая лишняя схема — это
      # токены в КАЖДОМ ходу и лишний шум при выборе инструмента для дешёвой
      # модели. Оставляем только то, что реально нужно для работы со временем.
      # Список имён сверь на сервере (`hermes mcp test todoist`) — см. runbook.
      include:
        - find-tasks            # прочитать задачи
        - find-tasks-by-date    # что на сегодня/завтра — основа утренней сводки
        - find-completed-tasks  # что сделано (для сводки "за ночь/вчера")
        - add-tasks             # поставить задачу
        - update-tasks          # поправить текст/приоритет
        - complete-tasks        # закрыть
        - reschedule-tasks      # перенести срок (именно этим, не update-tasks —
                                # иначе ломается повторяемость у регулярных задач)
        - find-projects         # понимать структуру проектов
        - get-overview          # общая картина загрузки

# Доступ только владельцу. ID своего Telegram-аккаунта узнать у @userinfobot.
# Реальное значение задаётся мастером gateway setup / в .env
# (TELEGRAM_ALLOWED_USERS). Здесь — как напоминание о принципе "по умолчанию deny".

# --- Opt-in в оркестраторский режим Kanban (фаза 5) ---
# НЕОЧЕВИДНО, но обязательно: убрать `kanban` из disabled_toolsets НЕ достаточно.
# Инструменты kanban_* появляются в сессии только если профиль явно перечислил
# `kanban` вот в этом верхнеуровневом ключе `toolsets` — так устроена проверка
# _profile_has_kanban_toolset() в tools/kanban_tools.py, и то же сказано в
# документации Hermes: "available to orchestrator profiles that enable kanban
# in their toolsets config". Без этой строки агент видит kanban в списке
# тулсетов при старте, но вызвать kanban_create не может (поймано на живом
# прогоне: секретарь не нашёл инструмент и полез обходить через терминал).
# `hermes-cli` — дефолтный набор, его сохраняем.
toolsets:
  - hermes-cli
  - kanban

# --- Явный набор инструментов по площадкам (фаза 5) ---
# ДВА КЛЮЧА, НЕ ОДИН. Hermes резолвит инструменты по имени площадки:
# platform_toolsets.get(platform) в hermes_cli/tools_config.py. `cli` — это
# терминальные сессии И воркеры Kanban (диспетчер запускает исполнителя как
# `hermes -p <профиль>`, пиня набор через --toolsets). `telegram` — сессии из
# группового чата и лички бота.
#
# ПОЧЕМУ ОБА ЯВНО: пока был только `cli`, сессия в Telegram откатывалась на
# дефолтный композит `hermes-telegram` — и юрист в общем чате честно сказал
# «у меня нет веб-инструмента», хотя в CLI веб у него был. Списки держим
# одинаковыми, чтобы агент был одним и тем же человеком в чате и в работе.
#
# `office` — тулсет плагина office-gate, даёт инструмент office_report:
# им исполнитель сам пишет в общий чат, от кого получил задачу и что сделал.
# Нужен и в `cli` тоже — карточки Kanban выполняет именно CLI-воркер.
# `agent.disabled_toolsets` выше продолжает работать как вычитание.
platform_toolsets:
  cli:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - tts
    - terminal
    - office
  telegram:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - tts
    - terminal
    - office
