# Конфиг профиля "secretary" для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/secretary/config.yaml
#
# ВАЖНО:
#  - Для provider: custom Hermes требует api_key ПРЯМО в этом файле — это
#    единственное место, откуда он его читает для кастомных эндпоинтов.
#    OPENAI_API_KEY в .env сюда НЕ подхватывается (тот env-var — только для
#    встроенного провайдера openai-api). Да, это означает, что этот файл
#    содержит секрет и в git попадать не должен как есть с реальным ключом —
#    храни файл с реальным ключом только на VPS, не коммить.
#  - Токен Telegram-бота — отдельно, в .env (см. profiles/.env.example).
#  - Значения в <угловых скобках> заменить на свои. Проще всего задать их
#    мастером `hermes -p secretary model` (он сам пропишет provider/base_url/
#    api_key сюда), а characterи/тулсеты в этом файле держать вручную.

model:
  provider: custom                 # CheapVibeCode — OpenAI-совместимый эндпоинт
  base_url: <CHEAPVIBECODE_BASE_URL>   # напр. https://cheapvibecode.ru/v1
  default: <MODEL_ID>              # проверенная модель, напр. gpt-5.6-terra
  api_key: <CHEAPVIBECODE_API_KEY>  # ОБЯЗАТЕЛЬНО здесь, не в .env — см. пояснение выше
  # context_length: 200000         # раскомментировать, если авто-детект занижает

agent:
  # Секретарь — лёгкий. Выключаем всё тяжёлое и опасное; оставляем только
  # то, что реально нужно для времени/напоминаний/сводок.
  # Оставлены (не в списке ниже): memory, cronjob, session_search, web,
  #   skills, todo.
  # Выключены:
  disabled_toolsets:
    - terminal        # секретарю не нужен шелл
    - code_execution  # и выполнение кода
    - browser         # тяжёлая браузерная автоматизация
    - computer_use
    - delegation      # включим на этапе офиса
    - kanban          # включим на этапе офиса
    - image_gen
    - video
    - video_gen
    - vision
    - x_search

# Доступ только владельцу. ID своего Telegram-аккаунта узнать у @userinfobot.
# Реальное значение задаётся мастером gateway setup / в .env
# (TELEGRAM_ALLOWED_USERS). Здесь — как напоминание о принципе "по умолчанию deny".
