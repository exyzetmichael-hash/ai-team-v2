# Конфиг профиля "secretary" для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/secretary/config.yaml
#
# ПРОВАЙДЕР: OpenRouter (перешли на него после того, как ру-реселлеры оказались
# нерабочими — см. docs/phase-1-runbook.md, раздел "Провайдер"). OpenRouter —
# первоклассный провайдер Hermes: ключ уходит в .env как OPENROUTER_API_KEY,
# а сюда пишется только выбор модели. Проще всего настроить мастером
# `hermes -p secretary model` → OpenRouter → вставить ключ → выбрать модель.
# Мастер сам корректно пропишет всё в нужные места (не редактируй руками —
# на ручных правках YAML мы уже обжигались).
#
# ВАЖНО про геоблок: OpenRouter блокирует российские IP (403). Сервер должен
# быть НЕ в РФ (у нас — Contabo EU). См. runbook.

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash   # дёшево ($0.10/$0.20 за 1M) + рабочий tool-calling; для лёгкого секретаря идеально
  # ключ — в .env: OPENROUTER_API_KEY=sk-or-...
  # запасная модель, если deepseek начнёт чудить: openai/gpt-5.4-mini (дороже, но предсказуемее в tool-calling)

agent:
  # Секретарь — лёгкий. Выключаем всё тяжёлое и опасное; оставляем только
  # то, что реально нужно для времени/напоминаний/сводок.
  # На практике урезали через `hermes -p secretary tools` до: memory, todo, cronjob.
  # disabled_toolsets ниже — дублирующая страховка на случай сброса per-platform.
  disabled_toolsets:
    - terminal        # секретарю не нужен шелл
    - code_execution  # и выполнение кода
    - browser         # тяжёлая браузерная автоматизация
    - computer_use
    - delegation      # fork/join сабагенты внутри своего же контекста — секретарю не нужно, не путать с Kanban (офисная передача задач другому профилю — отдельная фича, включаем её в фазе 5)
    - kanban          # включим на этапе офиса (см. docs/phase-5-runbook.md)
    - image_gen
    - video
    - video_gen
    - vision
    - x_search

# Доступ только владельцу. ID своего Telegram-аккаунта узнать у @userinfobot.
# Реальное значение задаётся мастером gateway setup / в .env
# (TELEGRAM_ALLOWED_USERS). Здесь — как напоминание о принципе "по умолчанию deny".
