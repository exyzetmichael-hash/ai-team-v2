# Конфиг профиля "tutor" (учебный наставник) для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/tutor/config.yaml
#
# Провайдер — как у всех: OpenRouter, ключ в .env как OPENROUTER_API_KEY.
# Настраивай мастером `hermes -p tutor model`, не редактируй provider/api_key руками.

timezone: Europe/Moscow

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash
  # ⚠️ Самый вероятный кандидат на апгрейд из всех профилей. Математика и разбор
  # алгоритмов требуют аккуратного рассуждения, а неверное объяснение хуже
  # отсутствия объяснения — оно закрепляется в голове. Если заметишь враньё в
  # выкладках — сюда: deepseek/deepseek-v4-pro или openai/gpt-5.4-mini.

agent:
  # Лёгкий агент, НО с одним осознанным исключением: code_execution оставлен
  # включённым (его нет в списке ниже). Причина: тьютор разбирает алгоритмы,
  # Python и SQL — проверять решение запуском, а не "на глаз", это буквально
  # суть роли. Терминал/файловую систему при этом НЕ даём: code_execution
  # исполняет код, но не даёт бродить по серверу (ФС остаётся только у brain,
  # принцип брифа 3.3).
  disabled_toolsets:
    - terminal
    - browser          # тяжёлая браузерная автоматизация; web_search при этом ОСТАЁТСЯ доступен
    - computer_use
    - delegation
    - kanban           # включим на этапе офиса (docs/phase-5-runbook.md)
    - image_gen
    - video
    - video_gen
    - vision           # если захочешь фотографировать задачи с листа — убрать эту строку
    - x_search
