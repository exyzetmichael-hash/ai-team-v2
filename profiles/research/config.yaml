# Конфиг профиля "research" (ресёрчер) для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/research/config.yaml
#
# Провайдер — как у всех: OpenRouter, ключ в .env как OPENROUTER_API_KEY.
# Настраивай мастером `hermes -p research model`, не редактируй provider/api_key руками.

timezone: Europe/Moscow

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash
  # Кандидат на апгрейд, если выжимки будут поверхностными: ресёрч требует
  # держать в голове несколько источников разом и замечать противоречия между
  # ними. openai/gpt-5.4-mini или deepseek/deepseek-v4-pro.

agent:
  # ⚠️ КЛЮЧЕВОЕ для этой роли: toolset `web` (web_search + web_extract) НЕ
  # отключён — без него ресёрчер бессмысленен. `browser` отключён сознательно:
  # это тяжёлая браузерная автоматизация (клики, скролл, скриншоты), она дорогая
  # и медленная, а для «найти и прочитать страницу» хватает web_search/web_extract.
  # Если понадобится ходить по сайтам, требующим логина/JS — убрать browser из
  # списка ниже, но это заметно дороже, включать осознанно.
  disabled_toolsets:
    - terminal
    - code_execution
    - browser
    - computer_use
    - delegation
    - kanban           # включим на этапе офиса (docs/phase-5-runbook.md)
    - image_gen
    - video
    - video_gen
    - vision
    - x_search         # отдельный поиск по X/Twitter — не нужен, обычного веб-поиска хватает
