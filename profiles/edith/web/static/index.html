<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EDITH</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Экран входа. Показывается ОДИН раз за устройство: токен потом лежит и в
     localStorage, и в cookie на год. Михаил: «логин каждый раз это вообще
     пиздец» — значит второй раз этот экран он видеть не должен никогда. -->
<div id="gate" class="gate hidden">
  <div class="gate-box">
    <h1>EDITH</h1>
    <p>Один раз — и больше не спросит</p>
    <input id="token-input" type="password" autocomplete="current-password" placeholder="токен">
    <button id="token-submit">Войти</button>
    <div id="gate-error" class="gate-error"></div>
  </div>
</div>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <button id="new-chat" class="new-chat">+ Новый разговор</button>
      <button id="close-sidebar" class="icon-btn only-mobile" aria-label="Закрыть">✕</button>
    </div>
    <div id="conv-list" class="conv-list"></div>
  </aside>
  <div id="scrim" class="scrim hidden"></div>

  <main class="main">
    <header class="topbar">
      <button id="open-sidebar" class="icon-btn only-mobile" aria-label="Разговоры">☰</button>
      <div id="conv-title" class="conv-title">EDITH</div>
      <button id="home-btn" class="icon-btn" aria-label="На главную">⌂</button>
    </header>

    <!-- Главный экран. Рисуется мгновенно из сохранённого снимка, потом
         молча обновляется свежими данными. -->
    <div id="home" class="home">
      <div class="greeting">
        <h1 id="greeting-line">EDITH</h1>
        <p id="greeting-sub" class="greeting-sub"></p>
      </div>

      <section id="stats-block" class="stats hidden">
        <div id="money-card" class="stat-card hidden">
          <span class="stat-icon">₽</span>
          <div class="stat-body">
            <span id="money-value" class="stat-value"></span>
            <span id="money-sub" class="stat-sub"></span>
          </div>
        </div>
        <div id="mail-card" class="stat-card hidden">
          <span class="stat-icon">✉</span>
          <div class="stat-body">
            <span id="mail-value" class="stat-value"></span>
            <span class="stat-sub">непрочитано</span>
          </div>
        </div>
      </section>

      <section id="events-block" class="block hidden">
        <h2 class="block-title">Сегодня</h2>
        <div id="events-list"></div>
      </section>

      <section id="tasks-block" class="block hidden">
        <h2 class="block-title">Задачи</h2>
        <div id="tasks-list"></div>
      </section>

      <div id="home-empty" class="home-empty hidden">Ничего срочного. Спрашивай.</div>
    </div>

    <div id="messages" class="messages hidden"></div>

    <form id="composer" class="composer">
      <button id="mic" type="button" class="mic" aria-label="Сказать голосом">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path fill="currentColor" d="M19 12a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-2.08A7 7 0 0 0 19 12z"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Написать или сказать…" autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Отправить">↑</button>
    </form>
  </main>

</div>

<script src="/static/app.js"></script>
</body>
</html>
