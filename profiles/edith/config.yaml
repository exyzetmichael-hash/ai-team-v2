# Конфиг профиля "edith" для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/edith/config.yaml
#
# EDITH заменяет собой всю "офисную" семёрку (secretary/brain/finance/tutor/
# tracker/research/legal) — один профиль, один бот, один разговор. Причина
# отказа от офиса — не техническая: сам формат "переписывайся с семью
# личностями по отдельности" не подошёл пользователю на практике (см. живое
# обсуждение в истории проекта). Специализация осталась, но внутри одного
# агента — через delegation (fork/join сабагенты, см. ниже), а не через
# отдельные Telegram-боты и Kanban-передачу.
#
# ПРОВАЙДЕР: OpenRouter (см. docs/phase-1-runbook.md, раздел "Провайдер").
# Ключ — в .env как OPENROUTER_API_KEY, сюда пишется только выбор модели.
# Настраивай мастером `hermes -p edith model`, не редактируй руками.
#
# ВАЖНО про геоблок: OpenRouter блокирует российские IP (403). Сервер должен
# быть НЕ в РФ (у нас — Contabo EU).

# ⚠️ ТАЙМЗОНА — ГДЕ МИХАИЛ ЖИВЁТ СЕЙЧАС, А НЕ КУДА СОБИРАЕТСЯ.
# Михаил в Красноярске (UTC+7). Перехода на летнее время в России нет.
# При переезде в Петербург (конец августа 2026) — сменить на Europe/Moscow
# и ПЕРЕСОЗДАТЬ cron-задачи (у задачи хранится абсолютное время следующего
# запуска, смена ключа сама по себе его не пересчитывает).
timezone: Asia/Krasnoyarsk

# Без этого Hermes оборачивает каждую cron-доставку в Telegram служебным
# "Cronjob Response: <имя> (job_id: ...) ------- ...". Для утренней сводки —
# просто шум поверх текста, уже отформатированного по MORNING.md.
cron:
  wrap_response: false

model:
  provider: openrouter
  # Переключено 2026-07 через `/model openai/gpt-5.6-luna --global` прямо из
  # Telegram — OpenAI срезали цену на Luna на 80%, на OpenRouter вышло
  # $0.10/$0.60 за 1M, дешевле deepseek-v4-flash при рабочем tool-calling и
  # контексте 1.05M. Проверено перед записью сюда (не по памяти — Luna не
  # существовала на момент обучения модели, которая пишет этот конфиг).
  # Синхронизирую здесь, чтобы репозиторий не разъезжался с боевым сервером
  # и следующий git pull + cp не откатил модель обратно на deepseek.
  default: openai/gpt-5.6-luna
  # запасная модель при 429/перегрузе провайдера — см. fallback_model ниже.

# Автотранскрипция голосовых из Telegram — уже встроена в гейтвей
# (agent/... _enrich_message_with_transcription вызывается сама на каждое
# входящее аудио, расшифровка подставляется как обычный текст сообщения;
# специально звать инструмент не нужно). Провайдер — Groq (whisper-large-v3-
# turbo): бесплатный тариф без карты (2000 запросов/день — с огромным
# запасом для личного использования), не грузит CPU/RAM сервера, лучше
# распознаёт русский, чем local-провайдер на модели `base`. Ключ — в .env
# как GROQ_API_KEY (console.groq.com, без карты).
#
# ⚠️ Прописываем ПОЛНОСТЬЮ, а не одним `provider:` — тот же урок, что с
# disabled_toolsets: профильный конфиг переопределяет ключ целиком, машинный
# stt: (enabled/local/openai) не домешивается автоматически.
stt:
  enabled: true
  provider: groq

# По умолчанию гейтвей отдельным сообщением "🎙️ ..." эхом присылает сырую
# расшифровку ДО ответа модели (gateway/run.py: _should_echo_stt_transcripts).
# Живьём проверено на первом голосовом — лишний шум, EDITH и так пересказывает
# суть в самом ответе. Ключ верхнеуровневый, не под stt: (gateway/config.py
# читает его как top-level или из gateway:, отдельного узла под stt: нет).
stt_echo_transcripts: false

# Hermes после хода форкает агента и спрашивает сам себя «стоит ли что-то
# запомнить / поправить скилл» (agent/background_review.py) — это ОТДЕЛЬНЫЙ
# вызов модели. Сам механизм полезен (EDITH накапливает знание о Михаиле,
# что как раз в духе «Джарвиса»), поэтому оставляем включённым, но строку
# «💾 Self-improvement review: Memory updated» в чат не шлём: это служебный
# шум, Михаил на него всё равно повлиять не может.
# Отключить механизм целиком (если полезет по деньгам) — skills:
# creation_nudge_interval: 0. Средний вариант — увести ревью на модель
# подешевле через auxiliary.background_review.{provider,model}.
#
# ⚠️ КАВЫЧКИ ОБЯЗАТЕЛЬНЫ. Без них YAML 1.1 читает `off` как булево False, а
# код делает `str(v).lower() if v else "on"` (gateway/run.py) — False попадает
# в ветку else, и уведомления остаются ВКЛЮЧЁННЫМИ. Настройка без кавычек
# даёт эффект, обратный задуманному, и молча.
display:
  memory_notifications: "off"

# Автоматическое переключение на запасную модель при 429/перегрузе.
# Зачем: провайдер (DeepSeek через OpenRouter) отвечает «Request rate
# increased too quickly», и без фолбэка эта ошибка приходит Михаилу прямо
# в чат вместо ответа. Всплыло живьём. Риск вырастет с включением скилла
# `research` — он шлёт 4-6 сабагентов ПАРАЛЛЕЛЬНО, то есть ровно тот burst,
# на который провайдер и ругается.
fallback_model:
  provider: openrouter
  model: openai/gpt-5.4-mini

agent:
  # ⚠️ Этот список ЗАМЕНЯЕТ машинный disabled_toolsets целиком, а не
  # дополняет его — `platform_toolsets` ниже НЕ является allowlist'ом и не
  # исключает тулсеты из реестра сам по себе (баг, живьём поймано на
  # первом запуске: kanban был не упомянут в platform_toolsets, но всё
  # равно оказался доступен, потому что machine-level disabled_toolsets
  # его отключал, а этот список — молча заменил тот целиком). Единственный
  # надёжный способ выключить тулсет — явно перечислить его здесь.
  disabled_toolsets:
    - code_execution  # выполнение произвольного кода не нужно; включить, если арифметика по деньгам начнёт хромать
    - browser         # тяжёлая браузерная автоматизация
    - computer_use
    - image_gen
    - video
    - video_gen
    - x_search
    - kanban          # офис снесён — координация через delegation, не Kanban
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - spotify
    - yuanbao
    - project         # не используется, лишние токены в каждом ходу
    - search          # избыточно рядом с web
    - context_engine  # не используется
    # delegation НЕ выключена — это ключевое отличие от старых семи профилей.
    # Раньше специализация шла через Kanban (адресная передача другому боту),
    # теперь — anonymous fork/join сабагенты внутри ОДНОГО контекста EDITH
    # (tools/delegate_tool.py: роли leaf/orchestrator, не именованные профили).
    # Ими EDITH сама уходит вглубь узкой темы (право/учёба/ресёрч/трекинг
    # проектов) и возвращается с ответом — Михаил этого не видит, для него
    # это один голос.
    # vision оставлена включённой — Google-таблица финансов может
    # потребовать распознать чек с фото.

# Ручное подтверждение по-настоящему опасных команд (rm -rf, форк-бомбы и
# т.п. из встроенного списка Hermes) — раз есть terminal (нужен для
# Google Workspace скрипта, см. MCP-блок ниже).
approvals:
  mode: manual

# --- MCP: todoist (задачи) ---
#
# filesystem/graphify (доступ к Obsidian vault) убраны 2026-08-14 — vault
# перенесён Михаилом в локальный Obsidian под Claude Code, EDITH его больше
# не читает и не пишет. Если понадобится вернуть — смотри git-историю этого
# файла (коммит с сообщением "edith: убрать vault").
mcp_servers:
  # Официальный сервер от Doist (@doist/todoist-mcp, npm), stdio-режим.
  # Токен НЕ вписывать сюда — Hermes подставляет ${TODOIST_API_KEY} из .env.
  todoist:
    command: npx
    args: ["-y", "@doist/todoist-mcp"]
    env:
      TODOIST_API_KEY: "${TODOIST_API_KEY}"
    tools:
      # Сервер отдаёт ~45 инструментов; оставляем только то, что реально
      # нужно — каждая лишняя схема это токены в каждом ходу.
      include:
        - find-tasks
        - find-tasks-by-date
        - find-completed-tasks
        - add-tasks
        - update-tasks
        - complete-tasks
        - reschedule-tasks
        - find-projects
        - get-overview

# --- Явный набор инструментов по площадкам ---
# ДВА КЛЮЧА, НЕ ОДИН. Hermes резолвит инструменты по имени площадки:
# platform_toolsets.get(platform) в hermes_cli/tools_config.py. `cli` —
# терминальные сессии. `telegram` — сессии из личного чата с ботом EDITH.
# Списки держим одинаковыми, чтобы агент был одним и тем же человеком
# в чате и в CLI — на этом уже обжигались в старом офисе (разные наборы
# толкали агента говорить "у меня нет такого инструмента" не по делу).
#
# terminal — нужен ради Google Workspace скрипта (`google_api.py`,
# календарь+таблицы) — у bundled-скилла нет отдельного тула, все операции
# идут через shell. Полноценный шелл, не ограниченный конкретными
# командами — риск смягчён approvals.mode: manual выше.
# НЕ ограничиваем terminal.cwd конкретной директорией — нужен доступ к
# Google-скрипту (google_api.py) в произвольном месте на сервере.
#
# ⚠️ `delegation` ОБЯЗАТЕЛЕН и его легко потерять. Когда в этих списках
# перечислены конкретные тулсеты (а не композит вроде `hermes-cli`), Hermes
# считает конфиг явным и включает СТРОГО перечисленное
# (hermes_cli/tools_config.py: has_explicit_config → прямое членство).
# Не указан `delegation` — нет инструмента `delegate_task`, а на нём стоит
# и вся внутренняя специализация EDITH (право/учёба/ресёрч), и скилл
# `research` целиком. Поймано при разборе скилла research: конфиг выглядел
# рабочим, но сабагентов физически не существовало.
# Сабагенты наследуют инструменты родителя минус блок-лист
# (tools/delegate_tool.py: delegate_task/clarify/memory/send_message/cronjob),
# поэтому `web` в этом списке нужен ещё и им — без него сабагент не может
# ни искать, ни читать страницы.
platform_toolsets:
  cli:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - terminal
    - vision
    - delegation
  telegram:
    - web
    - file
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - clarify
    - terminal
    - vision
    - delegation

# --- api_server: локальный OpenAI-совместимый /v1/chat/completions ---
#
# Нужен ТОЛЬКО для profiles/edith/guest-bridge/guest_bridge.py — моста между
# Telegram Guest Bots (Bot API 10.0, поле guest_message, апрель-май 2026) и
# EDITH. Сам Hermes про guest_message не знает (issue #21587, не начато) —
# мост говорит с Telegram напрямую, а сюда стучится за настоящим ответом
# EDITH (её SOUL, память, инструменты), не пересобирая агентный цикл заново.
#
# Слушает СТРОГО 127.0.0.1 (DEFAULT_HOST в api_server.py) — наружу не торчит,
# порт 8642 (DEFAULT_PORT) не пересекается с дашбордом (9119). Ключ — не
# сюда, а в .env как API_SERVER_KEY (тот же паттерн, что везде: секреты в
# .env, конфиг только про поведение). Без API_SERVER_KEY этот platform
# вообще не запустится (см. connect() в api_server.py) — это осознанно,
# не полагаемся на «случайно не сработает».
gateway:
  platforms:
    api_server:
      enabled: true

# --- Сжатие контекста: главный рычаг стоимости (аудит 2026-08-11) ---
#
# ЗАЧЕМ. Замер state.db показал: из 120.5M токенов 116.5M — это ЧТЕНИЕ
# КЭША, то есть перечитывание одной и той же разбухшей истории. Средний
# контекст — ~146K токенов на вызов при 795 вызовах. Одна Telegram-сессия
# от 30 июля (646 сообщений, 226 вызовов инструментов, никогда не
# сбрасывалась) съела $2.84 из $3.62 — 78% всех трат за период.
#
# ПРИЧИНА — в комментарии самого Hermes к proactive_prune_tokens: «на
# моделях с большим окном threshold (≈50% окна) срабатывает редко, поэтому
# старый вывод инструментов остаётся в истории и пересылается каждый ход».
# У luna окно 400K-1M → сжатие ждало 200-500K и сработало 1 (один) раз за
# 30 дней. А terminal — 619 вызовов, 52% всех инструментов, и вывод
# каждого оседал в контексте навсегда.
#
# ⚠️ Эти три ключа были выставлены через `hermes config set` прямо на
# сервере и жили ТОЛЬКО в живом конфиге. Дублируются сюда, иначе обычный
# `cp profiles/edith/config.yaml ~/.hermes/profiles/edith/` их затрёт.
compression:
  # Абсолютный порог вместо доли огромного окна. Сжатие теперь при 60K,
  # а не при 200-500K. Ужимает до threshold × target_ratio ≈ 12K.
  threshold_tokens: 60000
  # Детерминированная чистка старого вывода инструментов БЕЗ вызова LLM
  # (то есть бесплатная). Требует Hermes >= 0.20 — на 0.19 ключ molча
  # игнорировался, это и было причиной обновления 2026-08-11.
  proactive_prune_tokens: 48000
  # Сессия, возобновлённая после часа простоя, сжимает историю ДО первого
  # ответа. Прямо бьёт в сценарий «написал утром, вернулся вечером» —
  # именно он и дал ту дорогую сессию на $2.84.
  idle_compact_after_seconds: 3600

# --- Отключённые скиллы ---
#
# Установлено 94 скилла, за 30 дней EDITH грузила 9. Индекс скиллов сам по
# себе дёшев (9 KB в СТАБИЛЬНОЙ части промпта, кэшируется на 97.7%) —
# экономия тут доли процента, и это НЕ главная причина списка.
#
# Главное — риск: `skill_view` загружает SKILL.md ЦЕЛИКОМ в диалог, где
# кэш-тариф уже не действует, и файл висит там до конца сессии. В наборе
# лежали humanizer (34 KB), claude-code (34 KB), p5js (27 KB), comfyui
# (24 KB) — одна случайная загрузка это ~9K токенов навсегда. За 30 дней
# было 59 вызовов skill_view.
#
# Отключаются ТОЛЬКО плоские имена скиллов — категории Hermes не понимает
# (agent/skill_utils.py: `str(skill_name) in disabled`).
#
# Оставлены: 9 реально использованных + те, что попадают в задачи Михаила
# (учёба по ML, переезд, документы, маркетплейс с сентября).
# Вернуть любой — просто убрать строку отсюда.
skills:
