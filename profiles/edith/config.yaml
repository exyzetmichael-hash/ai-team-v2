# --- Служебные модели: механику — на дешёвую ---
#
# Все 18 слотов auxiliary по умолчанию на `provider: auto`, то есть на
# основной модели (luna). Аудит 2026-08-11 показал, что тогда это стоило
# копейки ($0.01), но выборка была нерепрезентативной: compression
# срабатывал ОДИН раз за 30 дней из-за высокого порога.
#
# ⚠️ Мы сами это изменили: с threshold_tokens 60000 сжатие теперь будет
# срабатывать регулярно. То есть обменяли дорогие перечитывания контекста
# на частые вызовы сжатия — часть выигрыша может уйти туда.
#
# Ниже уведены ТОЛЬКО механические задачи, где качество модели почти не
# влияет на пользу EDITH. Сознательно НЕ трогаем:
#   compression — решает, ЧТО запомнить из разговора; дешёвая модель здесь
#     означает забывчивого ассистента. Ждём реальных цифр из token_audit,
#     потом решаем по данным, а не по догадке.
#   vision — нужна модель с поддержкой картинок, mini не подойдёт.
#
# Модель та же, что уже стоит в fallback_model — проверена в бою (реально
# обслуживала запросы, когда основной провайдер отваливался).
auxiliary:
  title_generation:
    provider: openrouter
    model: openai/gpt-5.4-mini
  background_review:
    provider: openrouter
    model: openai/gpt-5.4-mini
  memory_query_rewrite:
    provider: openrouter
    model: openai/gpt-5.4-mini
  web_extract:
    provider: openrouter
    model: openai/gpt-5.4-mini
