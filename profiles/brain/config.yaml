# Конфиг профиля "brain" (второй мозг) для Hermes.
#
# Куда это кладётся на VPS:
#   ~/.hermes/profiles/brain/config.yaml
#
# Провайдер — тот же принцип, что у секретаря: OpenRouter, ключ в .env как
# OPENROUTER_API_KEY (НЕ здесь — см. profiles/.env.example). Настраивай
# мастером `hermes -p brain model`, не редактируй provider/base_url/api_key
# руками (на этом уже обжигались с профилем secretary).

# Явная таймзона. Сейчас brain не использует cron, но без этого ключа Hermes
# берёт системную зону сервера (EU) — на этом уже обожглись с секретарём, где
# "0 8 * * *" стреляло не в 8 утра по Москве. Ставим сразу, чтобы грабли не
# ждали своего часа, и чтобы даты в заметках/коммитах были в его времени.
timezone: Europe/Moscow

model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash   # та же дешёвая модель, что у секретаря — старт.
  # Если вывод по vault будет ощущаться поверхностным/путаным на большом vault —
  # апгрейд первым делом сюда, например openai/gpt-5.4-mini или deepseek-v4-pro:
  # второй мозг требует более аккуратного рассуждения о связях, чем секретарь.

agent:
  # brain изначально задумывался как единственный агент с terminal (требование
  # 3.3 брифа: "Файловая система — только у агента второго мозга"), но по факту
  # secretary тоже получил terminal — понадобился bundled-скиллу Google
  # Workspace, у которого нет отдельного тула для календаря (см. комментарий в
  # profiles/secretary/config.yaml и docs/phase-2-runbook.md). Разница не в
  # факте доступа, а в объёме: у secretary terminal общий (нет способа
  # ограничить его конкретными командами в Hermes), а у brain — сознательно
  # заперт в клон vault через terminal.cwd ниже, так что даже с полным шеллом
  # физически не может зацепить ничего за пределами vault.
  disabled_toolsets:
    - code_execution   # выполнение произвольного кода не нужно для работы с заметками
    - browser
    - computer_use
    - delegation       # fork/join сабагенты внутри своего же контекста — не нужно для работы с vault, не путать с Kanban (см. ниже)
    - image_gen
    - video
    - video_gen
    - x_search
    # vision оставлен включённым — vault может содержать картинки/скриншоты
    # kanban НЕ выключен (фаза 5, офис): даёт инструменты kanban_create/
    # kanban_show/kanban_complete и т.д. — как раз ими агенты передают работу
    # друг другу через общую доску ~/.hermes/kanban.db. Не путать с delegation
    # выше: то — безымянные сабагенты внутри своего же контекста, а это —
    # адресная передача задачи другому профилю команды.

terminal:
  backend: local
  # Ограничиваем рабочую директорию клоном vault — терминал агента не должен
  # уметь блуждать по остальной файловой системе сервера. Путь ниже — пример,
  # подставь свой (см. docs/phase-3-runbook.md, шаг 1).
  cwd: /home/michael/vault

# --- MCP: два сервера, разное назначение, оба нужны ---
mcp_servers:
  # Официальный filesystem MCP-сервер (@modelcontextprotocol/server-filesystem),
  # формат подтверждён по актуальным исходникам Hermes (cli-config.yaml.example).
  # Даёт agent'у read/write конкретно внутри указанной директории — не всей ФС.
  # Это по-прежнему основной путь чтения сырых заметок и (через terminal +
  # скилл vault-pr-write) путь записи — Graphify ниже НЕ пишет и не заменяет это.
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/michael/vault"]

  # Graphify — граф знаний поверх vault, дешёвые структурные запросы
  # (query_graph/get_node/get_neighbors/shortest_path) вместо перечитывания
  # сырых файлов на каждый вопрос. Только ЧТЕНИЕ графа — не пишет в vault,
  # не нужен LLM-ключ на этапе serve (он нужен только при построении графа,
  # см. docs/phase-3-runbook.md, шаг "Graphify"). У Graphify нет подкоманды
  # `serve` — единственный подтверждённый по README способ запуска сервера:
  # `python -m graphify.serve <путь-к-graph.json>`, и раз graphify ставится
  # изолированно через `uv tool install graphifyy`, вызывать нужно через
  # `uv tool run --from graphifyy`, иначе голый python пакет не найдёт.
  # graph.json собирается один раз командой `graphify extract` (шаг в runbook)
  # и лежит внутри клона vault, вне git (см. .gitignore) — путь ниже подставь
  # под свой реальный путь клона (тот же, что у filesystem/terminal.cwd выше).
  graphify:
    command: uv
    args: ["tool", "run", "--from", "graphifyy", "python", "-m", "graphify.serve", "/home/michael/vault/graphify-out/graph.json"]

# --- Kanban: этот gateway диспетчером НЕ работает (фаза 5) ---
# В офисе у каждого агента свой gateway (нужен для его Telegram-бота), но
# диспетчер Kanban должен быть РОВНО ОДИН на всю машину — им назначен
# секретарский gateway (см. profiles/secretary/config.yaml).
# Требование самой документации Hermes (docs/kanban/multi-gateway.md):
# несколько gateway с dispatch_in_gateway=true плодят параллельные SQLite-
# соединения к общей kanban.db и создают WAL-конкуренцию. Поэтому тут — false.
# Работу с доской через инструменты kanban_* это НЕ отключает: агент
# по-прежнему создаёт и закрывает карточки, просто не раздаёт их сам.
kanban:
  dispatch_in_gateway: false
